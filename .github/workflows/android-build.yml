name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Restore signing key
        # The same key for every build, so each APK installs over the previous one.
        # Secrets: KOBSER_KEYSTORE_BASE64 (the .jks, base64), KOBSER_KEYSTORE_PASSWORD, KOBSER_KEY_ALIAS.
        run: echo "${{ secrets.KOBSER_KEYSTORE_BASE64 }}" | base64 -d > android/kobser-release.jks

      - name: Build signed release APK and run unit tests
        working-directory: android
        env:
          KOBSER_KEYSTORE_FILE: kobser-release.jks
          KOBSER_KEYSTORE_PASSWORD: ${{ secrets.KOBSER_KEYSTORE_PASSWORD }}
          KOBSER_KEY_ALIAS: ${{ secrets.KOBSER_KEY_ALIAS }}
        run: gradle assembleRelease testDebugUnitTest --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk kobser.apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Attach (or replace) the APK on the release that was just published.
            gh release upload "${{ github.event.release.tag_name }}" kobser.apk --clobber
          else
            # Rolling prerelease holding the newest debug build from master.
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest kobser.apk \
              --title "Latest Build" \
              --notes "APK built automatically from the latest commit on master. Enable **Install from unknown sources** on your device, then open the file to install." \
              --prerelease
          fi
